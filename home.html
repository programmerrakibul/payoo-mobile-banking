<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <!-- Font Awesome CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
      integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Daisy UI CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />

    <!-- Tailwind CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="font-[Outfit] text-[#080808] bg-[#F4F5F7] text-base min-h-dvh">
    <!-- Home Container -->
    <div class="bg-white rounded-b-[28px] mb-6">
      <!-- Navbar -->
      <div class="border-b border-[#0808081a]">
        <div
          class="max-w-lg w-4/5 mx-auto flex justify-between items-center py-4"
        >
          <div class="flex items-center gap-2">
            <div class="size-12">
              <img src="./assets/Group.png" alt="" />
            </div>
            <div>
              <h3 class="opacity-90 font-semibold text-lg">
                $<span>45000</span>
              </h3>
              <span class="opacity-50 text-sm font-normal"
                >Balance Available</span
              >
            </div>
          </div>
          <button
            type="button"
            class="btn bg-transparent rounded-lg px-3 py-2.5"
          >
            <i
              class="fa-solid fa-arrow-up-from-bracket -rotate-90 text-[#666768]"
            ></i>
            <span class="opacity-50">Log Out</span>
          </button>
        </div>
      </div>

      <div class="max-w-lg w-4/5 mx-auto pb-6">
        <!-- Banner -->
        <div class="my-6">
          <h1 class="text-2xl font-bold mb-2.5">🔥 Welcome to Payooo!</h1>
          <p class="opacity-50 font-normal">
            Enjoy easy and convenient financial services with us. Cashout charge
            is low and
          </p>
        </div>

        <!-- Card Container -->
        <div id="card-container" class="grid grid-cols-3 gap-4">
          <!-- Add Money Card -->
          <div
            id="add-money-card"
            class="border border-[#0808081a] text-center rounded-xl px-2.5 py-5 cursor-default hover:bg-[#0874f20d] hover:border-[#0874F2] hover:text-[#0874F2] transition-all"
          >
            <img src="./assets/wallet1.png" alt="" class="mx-auto" />
            <h5 class="opacity-70 text-sm font-semibold mt-2">Add Money</h5>
          </div>

          <!-- Cashout Card -->
          <div
            id="chashout-card"
            class="border border-[#0808081a] text-center rounded-xl px-2.5 py-5 cursor-default hover:bg-[#0874f20d] hover:border-[#0874F2] hover:text-[#0874F2] transition-all"
          >
            <img src="./assets/send1.png" alt="" class="mx-auto" />
            <h5 class="opacity-70 text-sm mt-2 font-semibold">Cashout</h5>
          </div>

          <!-- Transfer Money Card -->
          <div
            id="transfer-money-card"
            class="border border-[#0808081a] text-center rounded-xl px-2.5 py-5 cursor-default hover:bg-[#0874f20d] hover:border-[#0874F2] hover:text-[#0874F2] transition-all"
          >
            <img src="./assets/money1.png" alt="" class="mx-auto" />
            <h5 class="opacity-70 text-sm mt-2 font-semibold">
              Transfer Money
            </h5>
          </div>

          <!-- Get Bonus Card -->
          <div
            id="bonus-card"
            class="border border-[#0808081a] text-center rounded-xl px-2.5 py-5 cursor-default hover:bg-[#0874f20d] hover:border-[#0874F2] hover:text-[#0874F2] transition-all"
          >
            <img src="./assets/bonus1.png" alt="" class="mx-auto" />
            <h5 class="opacity-70 text-sm mt-2 font-semibold">Get Bonus</h5>
          </div>

          <!-- Pay Bill Card -->
          <div
            id="pay-bill-card"
            class="border border-[#0808081a] text-center rounded-xl px-2.5 py-5 cursor-default hover:bg-[#0874f20d] hover:border-[#0874F2] hover:text-[#0874F2] transition-all"
          >
            <img src="./assets/purse1.png" alt="" class="mx-auto" />
            <h5 class="opacity-70 text-sm mt-2 font-semibold">Pay Bill</h5>
          </div>

          <!-- Transactions Card -->
          <div
            id="transaction-card"
            class="border border-[#0808081a] text-center rounded-xl px-2.5 py-5 cursor-default hover:bg-[#0874f20d] hover:border-[#0874F2] hover:text-[#0874F2] transition-all"
          >
            <img src="./assets/transaction1.png" alt="" class="mx-auto" />
            <h5 class="opacity-70 text-sm mt-2 font-semibold">Transactions</h5>
          </div>
        </div>
      </div>
    </div>

    <!-- Card Containers -->
    <div id="card-containers">
      <!-- Add Money Container -->
      <div id="add-money-container" class="max-w-lg w-4/5 mx-auto">
        <h3 class="mb-3 font-semibold text-lg opacity-90">Add Money</h3>

        <!-- Add Money Form -->
        <form action="" class="bg-white p-8 rounded-3xl w-full">
          <!-- Bank -->
          <div class="mb-4">
            <label for="banks" class="font-medium opacity-70"
              >Select A Bank</label
            >
            <select
              id="banks"
              class="select w-full mt-1 rounded-[32px] bg-[#F4F5F7] border-none font-light"
              aria-label="Select a Bank"
            >
              <option disabled selected>Select Bank</option>
              <option>AB Bank</option>
              <option>Sonali Bank</option>
              <option>Rupali Bank</option>
              <option>Janata Bank</option>
            </select>
          </div>

          <!-- Account Number -->
          <div class="mb-4">
            <label for="account-number" class="font-medium opacity-70"
              >Bank Account Number</label
            >
            <input
              id="account-number"
              type="text"
              placeholder="Enter 11 digit account number"
              class="input input-md w-full mt-1 rounded-[32px] bg-[#F4F5F7] border-none py-4 px-5"
            />
          </div>

          <!-- Amount to Add -->
          <div class="mb-4">
            <label for="add-amount" class="font-medium opacity-70"
              >Amount to Add</label
            >
            <input
              id="add-amount"
              type="text"
              placeholder="Add Amount to withdraw"
              class="input input-md w-full mt-1 rounded-[32px] bg-[#F4F5F7] border-none py-4 px-5"
            />
          </div>

          <!-- Pin Number -->
          <div class="mb-4">
            <label for="pin-number" class="font-medium opacity-70"
              >Pin Number</label
            >
            <input
              id="pin-number"
              type="text"
              placeholder="Enter 4 digit pin number"
              class="input input-md w-full mt-1 rounded-[32px] bg-[#F4F5F7] border-none py-4 px-5"
            />
          </div>
          <button
            id="add-money-btn"
            type="submit"
            class="btn w-full rounded-[32px] border-none bg-[#0874F2] text-white text-xl font-medium px-5 py-[14px]"
          >
            Add Money
          </button>
        </form>
      </div>

      <!-- Cash Out Container -->
      <div id="cash-out-container" class="max-w-lg w-4/5 mx-auto" hidden>
        <h3 class="mb-3 font-semibold text-lg opacity-90">Cash Out</h3>

        <!-- Cash Out Form -->
        <form action="" class="bg-white p-8 rounded-3xl w-full">
          <!-- Agent Number -->
          <div class="mb-4">
            <label for="agent-number" class="font-medium opacity-70"
              >Agent Number</label
            >
            <input
              id="agent-number"
              type="text"
              placeholder="Enter 11 digit number"
              class="input input-md w-full mt-1 rounded-[32px] bg-[#F4F5F7] border-none py-4 px-5"
            />
          </div>

          <!-- Amount to Withdraw -->
          <div class="mb-4">
            <label for="withdraw-amount" class="font-medium opacity-70"
              >Amount</label
            >
            <input
              id="withdraw-amount"
              type="text"
              placeholder="Enter amount to withdraw"
              class="input input-md w-full mt-1 rounded-[32px] bg-[#F4F5F7] border-none py-4 px-5"
            />
          </div>

          <!-- Pin Number -->
          <div class="mb-4">
            <label class="font-medium opacity-70">Pin Number</label>
            <input
              type="text"
              placeholder="Enter 4 digit pin number"
              class="input input-md w-full mt-1 rounded-[32px] bg-[#F4F5F7] border-none py-4 px-5"
            />
          </div>

          <!-- Withdraw Button -->
          <button
            id="cash-out-btn"
            type="submit"
            class="btn w-full rounded-[32px] border-none bg-[#0874F2] text-white text-xl font-medium px-5 py-[14px]"
          >
            Withdraw Money
          </button>
        </form>
      </div>

      <!-- Transfer Money Container -->
      <div id="transfer-money-container" class="max-w-lg w-4/5 mx-auto" hidden>
        <h3 class="mb-3 font-semibold text-lg opacity-90">Transfer Money</h3>

        <!-- Transfer Money Form -->
        <form action="" class="bg-white p-8 rounded-3xl w-full">
          <!-- User Account Number -->
          <div class="mb-4">
            <label for="user-account-number" class="font-medium opacity-70"
              >User Account Number</label
            >
            <input
              id="user-account-number"
              type="text"
              placeholder="Enter 11 digit number"
              class="input input-md w-full mt-1 rounded-[32px] bg-[#F4F5F7] border-none py-4 px-5"
            />
          </div>

          <!-- Amount to Add -->
          <div class="mb-4">
            <label for="transfer-amount" class="font-medium opacity-70"
              >Amount</label
            >
            <input
              id="transfer-amount"
              type="text"
              placeholder="Enter amount to transfer"
              class="input input-md w-full mt-1 rounded-[32px] bg-[#F4F5F7] border-none py-4 px-5"
            />
          </div>

          <!-- Pin Number -->
          <div class="mb-4">
            <label class="font-medium opacity-70">Pin Number</label>
            <input
              type="text"
              placeholder="Enter 4 digit pin number"
              class="input input-md w-full mt-1 rounded-[32px] bg-[#F4F5F7] border-none py-4 px-5"
            />
          </div>

          <!-- Transfer Money Button -->
          <button
            id="transfer-money-btn"
            type="submit"
            class="btn w-full rounded-[32px] border-none bg-[#0874F2] text-white text-xl font-medium px-5 py-[14px]"
          >
            Add Money
          </button>
        </form>
      </div>

      <!-- Get Bonus -->
      <div id="get-bonus-container" class="max-w-lg w-4/5 mx-auto" hidden>
        <h3 class="mb-3 font-semibold text-lg opacity-90">Get Bonus</h3>

        <!-- Get Bonus Form -->
        <form action="" class="bg-white p-8 rounded-3xl w-full">
          <!-- Coupon -->
          <div class="mb-4">
            <label class="font-medium opacity-70">Enter Bonus Coupon</label>
            <input
              type="text"
              placeholder="Enter your coupon"
              class="input input-md w-full mt-1 rounded-[32px] bg-[#F4F5F7] border-none py-4 px-5"
            />
          </div>

          <!-- Get Bonus Button -->
          <button
            id="bonus-btn"
            type="submit"
            class="btn w-full rounded-[32px] border-none bg-[#0874F2] text-white text-xl font-medium px-5 py-[14px]"
          >
            Get Bonus
          </button>
        </form>
      </div>

      <!-- Pay Bill Container -->
      <div id="pay-bill-container" class="max-w-lg w-4/5 mx-auto" hidden>
        <h3 class="mb-3 font-semibold text-lg opacity-90">Pay Bill</h3>

        <!-- Pay Bill Form -->
        <form action="" class="bg-white p-8 rounded-3xl w-full">
          <!-- Biller -->
          <div class="mb-4">
            <label for="pay" class="font-medium opacity-70"
              >Select To Pay</label
            >
            <select
              id="pay"
              class="select w-full mt-1 rounded-[32px] bg-[#F4F5F7] border-none font-light"
              aria-label="Select To Pay"
            >
              <option disabled selected>Select To Pay</option>
              <option>Gas Bill</option>
              <option>Bank Deposit</option>
              <option>Electricity Bill</option>
            </select>
          </div>

          <!-- Enter account number -->
          <div class="mb-4">
            <label for="biller-account-number" class="font-medium opacity-70"
              >Enter account number</label
            >
            <input
              id="biller-account-number"
              type="text"
              placeholder="Enter account number"
              class="input input-md w-full mt-1 rounded-[32px] bg-[#F4F5F7] border-none py-4 px-5"
            />
          </div>

          <!-- Amount to Pay -->
          <div class="mb-4">
            <label for="pay-amount" class="font-medium opacity-70"
              >Amount to Pay</label
            >
            <input
              id="pay-amount"
              type="text"
              placeholder="Add Amount to pay"
              class="input input-md w-full mt-1 rounded-[32px] bg-[#F4F5F7] border-none py-4 px-5"
            />
          </div>

          <!-- Pin Number -->
          <div class="mb-4">
            <label class="font-medium opacity-70">Pin Number</label>
            <input
              type="text"
              placeholder="Enter 4 digit pin number"
              class="input input-md w-full mt-1 rounded-[32px] bg-[#F4F5F7] border-none py-4 px-5"
            />
          </div>
          <button
            id="pay-bill-btn"
            type="submit"
            class="btn w-full rounded-[32px] border-none bg-[#0874F2] text-white text-xl font-medium px-5 py-[14px]"
          >
            Pay Now
          </button>
        </form>
      </div>
    </div>

    <!-- Script -->
    <script src="./js/home.js"></script>
  </body>
</html>
